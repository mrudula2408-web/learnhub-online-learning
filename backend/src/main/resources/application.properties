# =====================================================
# LearnHub Backend Configuration
# Spring Boot application.properties
# =====================================================

# Server runs on port 8081
server.port=8081

# =====================================================
# MySQL DataSource Configuration
# Can be overridden with environment variable DB_PASSWORD
# =====================================================
spring.datasource.url=jdbc:mysql://localhost:3306/learnhub_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:${LEARNHUB_DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================
# JPA / Hibernate Settings
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =====================================================
# HTTP Session Settings
# =====================================================
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# =====================================================
# Logging
# =====================================================
logging.level.com.learnhub=DEBUG
logging.level.org.springframework.web=INFO
