# =====================================================
# LearnHub Backend Configuration - Production & Local
# Spring Boot application.properties
# =====================================================

# Server Port (uses cloud environment PORT if set, else defaults to 8081)
server.port=${PORT:8081}

# Optional local properties (gitignored)
spring.config.import=optional:classpath:application-local.properties

# =====================================================
# MySQL DataSource Configuration
# Reads from cloud database environment variables if deployed:
#   SPRING_DATASOURCE_URL or DB_URL
#   SPRING_DATASOURCE_USERNAME or DB_USERNAME
#   SPRING_DATASOURCE_PASSWORD or DB_PASSWORD
# =====================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3306/learnhub_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${LEARNHUB_DB_PASSWORD:}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================
# JPA / Hibernate Settings
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =====================================================
# HTTP Session Settings (Cross-Site Cookie support for Vercel + Cloud Host)
# =====================================================
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

# =====================================================
# Logging
# =====================================================
logging.level.com.learnhub=INFO
logging.level.org.springframework.web=INFO
